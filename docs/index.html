<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniScroll Core</title>
    <meta name="description" content="Browser-based configurator for OmniScroll. No app required — configure over USB.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #0c0c0e;
            --surface:  #141417;
            --raised:   #1e1e22;
            --border:   rgba(255,255,255,0.06);
            --text:     #ebebeb;
            --muted:    #6b6b76;
            --accent:   #00d4ff;
            --radius:   10px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ---- Header ---- */
        header {
            position: sticky; top: 0; z-index: 200;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 28px;
            height: 56px;
            background: rgba(20, 20, 23, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .logo { font-size: 15px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
        .logo em { color: var(--accent); font-style: normal; }

        .conn-btn {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--raised);
            color: var(--text);
            font: 600 13px 'Inter', sans-serif;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .conn-btn:hover { border-color: var(--accent); }
        .conn-btn.connected { border-color: #22c55e; background: rgba(34,197,94,0.08); color: #22c55e; }

        .status-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--muted);
            transition: background 0.3s;
        }
        .conn-btn.connected .status-dot { background: #22c55e; box-shadow: 0 0 6px #22c55e80; }

        /* ---- Mode bar ---- */
        #modebar {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 28px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .modebar-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .mode-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px; font-weight: 700; letter-spacing: 1px;
            background: var(--raised);
            border: 1px solid var(--border);
            transition: background 0.3s;
        }

        .mode-badge-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }

        /* ---- Main grid ---- */
        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 960px;
            margin: 28px auto;
            padding: 0 20px 60px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
        }

        .card.full { grid-column: 1 / -1; }

        .card-title {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.8px; color: var(--muted);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        /* ---- Global sliders ---- */
        .row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .row:last-child { border-bottom: none; }

        .row-label { font-size: 13px; font-weight: 500; }
        .row-val   { font-size: 12px; font-family: monospace; color: var(--accent); background: var(--raised); padding: 3px 8px; border-radius: 4px; }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%; height: 4px; margin: 10px 0;
            background: var(--raised); border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--accent); cursor: pointer;
            box-shadow: 0 0 8px rgba(0,212,255,0.4);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.25); }

        .cpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }

        /* ---- Buttons ---- */
        .btn {
            padding: 9px 16px; border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--raised);
            color: var(--text); font: 600 13px 'Inter', sans-serif;
            cursor: pointer; transition: all 0.15s;
            text-align: center;
        }
        .btn:hover { border-color: var(--accent); background: rgba(0,212,255,0.05); }
        .btn.active { border-color: var(--accent); background: rgba(0,212,255,0.12); color: var(--accent); }
        .btn.primary { background: var(--accent); color: #000; border-color: transparent; font-weight: 700; }
        .btn.primary:hover { background: #00b8d9; }
        .btn.full { width: 100%; margin-top: 14px; }

        /* ---- Toggle ---- */
        .toggle-switch {
            position: relative; width: 36px; height: 20px; cursor: pointer;
        }
        .toggle-switch input { display: none; }
        .toggle-track {
            position: absolute; inset: 0;
            background: var(--raised); border-radius: 10px;
            border: 1px solid var(--border);
            transition: background 0.2s;
        }
        .toggle-thumb {
            position: absolute; top: 3px; left: 3px;
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--muted);
            transition: transform 0.2s, background 0.2s;
        }
        .toggle-switch input:checked ~ .toggle-track { background: rgba(0,212,255,0.2); border-color: var(--accent); }
        .toggle-switch input:checked ~ .toggle-thumb { transform: translateX(16px); background: var(--accent); }

        /* ---- Mode rows ---- */
        .mode-row {
            display: grid;
            grid-template-columns: 1fr 90px auto auto auto;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .mode-row:last-child { border-bottom: none; }
        .mode-row.disabled { opacity: 0.35; }
        .mode-name { font-size: 13px; font-weight: 600; letter-spacing: 0.5px; }
        .mode-sub  { font-size: 11px; color: var(--muted); }

        .hp-select {
            background: var(--raised); border: 1px solid var(--border);
            color: var(--text); font: 500 12px 'Inter'; border-radius: 5px;
            padding: 5px 8px; width: 90px; cursor: pointer;
        }

        /* ---- Color swatch ---- */
        .color-swatch {
            width: 28px; height: 28px; border-radius: 50%;
            cursor: pointer; border: 2px solid transparent;
            transition: border-color 0.2s, transform 0.15s;
            box-shadow: 0 0 0 2px var(--raised), 0 0 0 3px var(--border);
        }
        .color-swatch:hover { transform: scale(1.15); border-color: var(--accent); }

        /* ---- Color Wheel Modal ---- */
        #colorModal {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 500;
            justify-content: center; align-items: center;
        }
        #colorModal.open { display: flex; }

        .color-modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            width: 300px;
            display: flex; flex-direction: column; gap: 16px;
        }

        .color-modal-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

        #colorWheel { border-radius: 50%; cursor: crosshair; display: block; margin: 0 auto; }

        .bri-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
        .bri-row input { flex: 1; }

        .color-preview-row { display: flex; align-items: center; gap: 12px; }
        .color-preview { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; }
        .hex-input {
            flex: 1; background: var(--raised); border: 1px solid var(--border);
            color: var(--text); font: 500 14px monospace; border-radius: 5px;
            padding: 7px 10px;
        }
        .hex-input:focus { outline: none; border-color: var(--accent); }

        .modal-actions { display: flex; gap: 8px; }
        .modal-actions .btn { flex: 1; }
    </style>
</head>
<body>

<!-- Header -->
<header>
    <div class="logo">Omni<em>Scroll</em></div>
    <button class="conn-btn" id="connBtn">
        <div class="status-dot"></div>
        <span id="connText">Connect Device</span>
    </button>
</header>

<!-- Mode Badge Bar -->
<div id="modebar">
    <span class="modebar-label">Active Mode</span>
    <div class="mode-badge" id="modeBadge">
        <div class="mode-badge-dot" id="modeBadgeDot"></div>
        <span id="modeBadgeName">—</span>
    </div>
</div>

<!-- Main Content -->
<main>

    <!-- Haptic Engine -->
    <div class="card">
        <div class="card-title">Haptic Engine</div>

        <div style="display:grid; grid-template-columns: repeat(5,1fr); gap:6px;" id="profileGrid">
            <!-- filled by JS -->
        </div>

        <button class="btn full" id="testHapticBtn" style="margin-top:16px;">Fire Test Click</button>
    </div>

    <!-- Global Settings -->
    <div class="card">
        <div class="card-title">Global Settings</div>

        <div class="row">
            <span class="row-label">LED Brightness</span>
            <span class="row-val" id="bri_val">100%</span>
        </div>
        <input type="range" id="bri" min="0" max="100" value="100" oninput="onBriInput()">

        <div class="row" style="margin-top:8px;">
            <span class="row-label">Idle Dim Timeout</span>
            <span class="row-val" id="idle_val">30s</span>
        </div>
        <input type="range" id="idle" min="0" max="120" step="5" value="30" oninput="onIdleInput()">

        <div class="row" style="margin-top:8px;">
            <span class="row-label">Touch Sensitivity</span>
            <span class="row-val" id="thr_val">800</span>
        </div>
        <input type="range" id="thr" min="100" max="3000" step="50" value="800" oninput="onThrInput()">

        <div class="row" style="margin-top: 16px;">
            <div>
                <div class="row-label">Sensor Resolution (CPI)</div>
                <div class="mode-sub" style="margin-top:3px;">Higher = faster rotation response</div>
            </div>
        </div>
        <div class="cpi-grid" id="cpiGrid">
            <button class="btn" onclick="setCPI(0)">400</button>
            <button class="btn active" onclick="setCPI(1)">800</button>
            <button class="btn" onclick="setCPI(2)">1200</button>
            <button class="btn" onclick="setCPI(3)">1600</button>
        </div>
    </div>

    <!-- Mode Configuration -->
    <div class="card full">
        <div class="card-title">Mode Configuration</div>
        <div id="modeList"><!-- filled by JS --></div>
    </div>

</main>

<!-- Color Wheel Modal -->
<div id="colorModal">
    <div class="color-modal-box">
        <div class="color-modal-title" id="colorModalTitle">Select Color</div>
        <canvas id="colorWheel" width="240" height="240"></canvas>
        <div class="bri-row">
            <span>Dark</span>
            <input type="range" id="briWheel" min="0" max="100" value="100" oninput="onWheelBri()">
            <span>Bright</span>
        </div>
        <div class="color-preview-row">
            <div class="color-preview" id="colorPreview"></div>
            <input class="hex-input" type="text" id="hexInput" maxlength="7" placeholder="#0000ff" oninput="onHexInput()">
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closeColorModal()">Cancel</button>
            <button class="btn primary" onclick="confirmColor()">Apply</button>
        </div>
    </div>
</div>

<script>
// =====================================================
// State
// =====================================================
let port, writer, reader, connected = false;
let statusInterval;

const PROFILES = ["Click", "Thud", "Tick", "Soft", "Off"];

const MODE_DESCRIPTIONS = {
    "SCROLL":     "Vertical page scroll",
    "VOLUME":     "System volume control",
    "TIMELINE":   "Frame-by-frame arrow keys",
    "ZOOM":       "Ctrl+Scroll — universal zoom",
    "H_SCROLL":   "Horizontal scroll axis",
    "BRIGHTNESS": "Display brightness keys",
    "TABBING":    "Ctrl+Tab — browser / app switching",
    "UNDO_REDO":  "Ctrl+Z / Ctrl+Shift+Z",
};

let config = {
    bri: 100, idle: 30, cpi: 1, thr: 800,
    modes: []
};

// For color wheel modal
let colorModalTargetMode = -1;
let selectedH = 0, selectedS = 0, selectedV = 100;
let wheelCanvas, wheelCtx;

// =====================================================
// Web Serial
// =====================================================
async function connectSerial() {
    if (connected) { handleDisconnect(); return; }
    try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        writer = port.writable.getWriter();
        connected = true;

        document.getElementById('connBtn').classList.add('connected');
        document.getElementById('connText').textContent = 'Disconnect';

        startReading();
        await sendCommand("GET:CONFIG");
        statusInterval = setInterval(() => sendCommand("GET:STATUS"), 300);
    } catch (e) {
        console.error(e);
        alert("Connection failed. Ensure no other app (e.g. Arduino IDE) is using the port.");
    }
}

async function sendCommand(cmd) {
    if (!connected || !writer) return;
    await writer.write(new TextEncoder().encode(cmd + '\n'));
}

async function startReading() {
    reader = port.readable.getReader();
    const dec = new TextDecoder();
    let buf = '';
    try {
        while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            let lines = buf.split('\n');
            buf = lines.pop();
            for (let line of lines) {
                line = line.trim();
                if (line.startsWith("STATUS:")) handleStatus(line.substring(7));
                else if (line.startsWith("CONFIG:")) handleConfig(line.substring(7));
            }
        }
    } catch (err) { console.error(err); }
    finally { reader.releaseLock(); handleDisconnect(); }
}

function handleDisconnect() {
    connected = false;
    clearInterval(statusInterval);
    document.getElementById('connBtn').classList.remove('connected');
    document.getElementById('connText').textContent = 'Connect Device';
    document.getElementById('modeBadgeName').textContent = '—';
    document.getElementById('modeBadgeDot').style.background = 'var(--muted)';
}

function handleStatus(json) {
    try {
        const d = JSON.parse(json);
        document.getElementById('modeBadgeName').textContent = d.mode;

        // Find mode color
        const m = config.modes.find(x => x.name === d.mode);
        if (m) {
            document.getElementById('modeBadgeDot').style.background = '#' + m.c;
        }
    } catch(e) {}
}

function handleConfig(json) {
    try {
        const d = JSON.parse(json);
        config = d;
        applyConfigToUI();
    } catch(e) {}
}

// =====================================================
// Sending Settings
// =====================================================
function sendGlobal() {
    const bri  = document.getElementById('bri').value;
    const idle = document.getElementById('idle').value;
    const thr  = document.getElementById('thr').value;
    sendCommand(`SET:BRI:${bri},IDLE:${idle},THR:${thr}`);
}

function setCPI(level) {
    config.cpi = level;
    renderCPIButtons();
    sendCommand(`SET:CPI:${level}`);
}

function sendModeConfig(idx) {
    const m = config.modes[idx];
    if (!m) return;
    sendCommand(`SET:MODE:${idx},EN:${m.en},CS:${m.c},HP:${m.hp},INV:${m.inv},MTHR:${m.thr}`);
}

// =====================================================
// UI Rendering
// =====================================================
function applyConfigToUI() {
    document.getElementById('bri').value  = config.bri;
    document.getElementById('idle').value = config.idle;
    document.getElementById('thr').value  = config.thr;
    document.getElementById('bri_val').textContent  = config.bri + '%';
    document.getElementById('idle_val').textContent = config.idle + 's';
    document.getElementById('thr_val').textContent  = config.thr;
    config.cpi = config.cpi || 1;
    renderCPIButtons();
    renderHapticProfiles(config.modes[0]?.hp ?? 0); // will be per-mode in mode rows
    renderModeList();
}

function renderCPIButtons() {
    const btns = document.querySelectorAll('#cpiGrid .btn');
    btns.forEach((b, i) => b.classList.toggle('active', i === config.cpi));
}

function renderHapticProfiles(activeProfile) {
    const grid = document.getElementById('profileGrid');
    grid.innerHTML = '';
    PROFILES.forEach((name, i) => {
        const btn = document.createElement('button');
        btn.className = 'btn' + (i === activeProfile ? ' active' : '');
        btn.textContent = name;
        btn.onclick = () => {
            // Apply to all currently selected mode context (we'll handle per-mode in mode rows)
            grid.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        };
        grid.appendChild(btn);
    });
}

function renderModeList() {
    const list = document.getElementById('modeList');
    list.innerHTML = '';

    (config.modes || []).forEach((mode, idx) => {
        const row = document.createElement('div');
        row.className = 'mode-row' + (mode.en ? '' : ' disabled');
        row.id = `mode-row-${idx}`;

        const colorHex = '#' + (mode.c || '888888');

        row.innerHTML = `
            <div>
                <div class="mode-name">${mode.name}</div>
                <div class="mode-sub">${MODE_DESCRIPTIONS[mode.name] || ''}</div>
            </div>
            <select class="hp-select" id="hp_${idx}" onchange="onHPChange(${idx})">
                ${PROFILES.map((p, i) => `<option value="${i}" ${i == mode.hp ? 'selected' : ''}>${p}</option>`).join('')}
            </select>
            <div class="color-swatch" id="swatch_${idx}"
                 style="background:${colorHex}"
                 title="Pick color"
                 onclick="openColorModal(${idx})"></div>
            <label class="toggle-switch" title="Invert direction">
                <input type="checkbox" id="inv_${idx}" ${mode.inv ? 'checked' : ''} onchange="onInvChange(${idx})">
                <div class="toggle-track"></div>
                <div class="toggle-thumb"></div>
            </label>
            <label class="toggle-switch" title="Enable mode">
                <input type="checkbox" id="en_${idx}" ${mode.en ? 'checked' : ''} onchange="onEnChange(${idx})">
                <div class="toggle-track"></div>
                <div class="toggle-thumb"></div>
            </label>
        `;
        list.appendChild(row);
    });

    // Column headers
    const legend = document.createElement('div');
    legend.style.cssText = 'display:grid;grid-template-columns:1fr 90px auto auto auto;gap:12px;padding:12px 0 6px;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;border-top:1px solid var(--border);margin-top:8px;';
    legend.innerHTML = '<span>Mode</span><span>Haptic</span><span style="text-align:center">Color</span><span style="text-align:center">Invert</span><span style="text-align:center">Active</span>';
    list.insertBefore(legend, list.firstChild);
}

function onEnChange(idx) {
    config.modes[idx].en = document.getElementById(`en_${idx}`).checked ? 1 : 0;
    document.getElementById(`mode-row-${idx}`).className = 'mode-row' + (config.modes[idx].en ? '' : ' disabled');
    sendModeConfig(idx);
}

function onHPChange(idx) {
    config.modes[idx].hp = parseInt(document.getElementById(`hp_${idx}`).value);
    sendModeConfig(idx);
}

function onInvChange(idx) {
    config.modes[idx].inv = document.getElementById(`inv_${idx}`).checked ? 1 : 0;
    sendModeConfig(idx);
}

function onBriInput() {
    document.getElementById('bri_val').textContent = document.getElementById('bri').value + '%';
    sendGlobal();
}
function onIdleInput() {
    const v = document.getElementById('idle').value;
    document.getElementById('idle_val').textContent = v == 0 ? 'Off' : v + 's';
    sendGlobal();
}
function onThrInput() {
    document.getElementById('thr_val').textContent = document.getElementById('thr').value;
    sendGlobal();
}

// =====================================================
// Color Wheel
// =====================================================
function drawWheel(canvas, brightness) {
    const ctx = canvas.getContext('2d');
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const r  = cx - 4;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw HSV wheel: hue around ring, saturation from center
    const imageData = ctx.createImageData(canvas.width, canvas.height);
    const data = imageData.data;

    for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
            const dx = x - cx, dy = y - cy;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > r) continue;

            const angle  = Math.atan2(dy, dx);
            const hue    = ((angle / (2 * Math.PI)) + 1) % 1;
            const sat    = dist / r;
            const val    = brightness / 100;

            const [rr, gg, bb] = hsvToRgb(hue, sat, val);
            const idx = (y * canvas.width + x) * 4;
            data[idx]   = rr;
            data[idx+1] = gg;
            data[idx+2] = bb;
            data[idx+3] = 255;
        }
    }
    ctx.putImageData(imageData, 0, 0);

    // Draw selection dot
    const selAngle = selectedH * 2 * Math.PI - Math.PI;
    const selDist  = selectedS * r;
    const px = cx + selDist * Math.cos(selAngle);
    const py = cy + selDist * Math.sin(selAngle);

    ctx.beginPath();
    ctx.arc(px, py, 7, 0, 2*Math.PI);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(px, py, 5, 0, 2*Math.PI);
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
}

function hsvToRgb(h, s, v) {
    let r, g, b;
    const i = Math.floor(h * 6);
    const f = h * 6 - i;
    const p = v * (1 - s);
    const q = v * (1 - f * s);
    const t = v * (1 - (1 - f) * s);
    switch (i % 6) {
        case 0: r=v; g=t; b=p; break;
        case 1: r=q; g=v; b=p; break;
        case 2: r=p; g=v; b=t; break;
        case 3: r=p; g=q; b=v; break;
        case 4: r=t; g=p; b=v; break;
        case 5: r=v; g=p; b=q; break;
    }
    return [Math.round(r*255), Math.round(g*255), Math.round(b*255)];
}

function rgbToHex(r, g, b) {
    return ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c+c).join('');
    const n = parseInt(hex, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const d = max - min;
    let h = 0, s = max === 0 ? 0 : d / max, v = max;
    if (max !== min) {
        switch (max) {
            case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
            case g: h = ((b - r) / d + 2) / 6; break;
            case b: h = ((r - g) / d + 4) / 6; break;
        }
    }
    return [h, s, v * 100];
}

function updateColorPreview() {
    const bri = parseInt(document.getElementById('briWheel').value);
    const [r, g, b] = hsvToRgb(selectedH, selectedS, bri / 100);
    const hex = '#' + rgbToHex(r, g, b);
    document.getElementById('colorPreview').style.background = hex;
    document.getElementById('hexInput').value = hex;
    drawWheel(document.getElementById('colorWheel'), bri);
}

function openColorModal(modeIdx) {
    colorModalTargetMode = modeIdx;
    const m = config.modes[modeIdx];
    document.getElementById('colorModalTitle').textContent = 'Color — ' + m.name;

    // Parse current color
    const [r, g, b] = hexToRgb(m.c || '0000ff');
    const [h, s, v] = rgbToHsv(r, g, b);
    selectedH = h; selectedS = s; selectedV = v;
    document.getElementById('briWheel').value = Math.round(v);

    document.getElementById('colorModal').classList.add('open');
    updateColorPreview();

    // Attach wheel click/drag
    const canvas = document.getElementById('colorWheel');
    canvas.onmousedown = canvas.ontouchstart = wheelDown;
}

function wheelDown(e) {
    pickFromWheel(e);
    const canvas = document.getElementById('colorWheel');
    canvas.onmousemove = pickFromWheel;
    document.onmouseup = () => { canvas.onmousemove = null; document.onmouseup = null; };
}

function pickFromWheel(e) {
    const canvas = document.getElementById('colorWheel');
    const rect   = canvas.getBoundingClientRect();
    const cx = canvas.width / 2, cy = canvas.height / 2;
    const r  = cx - 4;

    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    const scaleX = canvas.width  / rect.width;
    const scaleY = canvas.height / rect.height;
    const dx = (clientX - rect.left) * scaleX - cx;
    const dy = (clientY - rect.top)  * scaleY - cy;
    const dist = Math.min(Math.sqrt(dx*dx + dy*dy), r);

    selectedH = ((Math.atan2(dy, dx) / (2 * Math.PI)) + 1) % 1;
    selectedS = dist / r;
    updateColorPreview();
    e.preventDefault();
}

function onWheelBri() {
    selectedV = parseInt(document.getElementById('briWheel').value);
    updateColorPreview();
}

function onHexInput() {
    const val = document.getElementById('hexInput').value;
    if (!/^#[0-9a-fA-F]{6}$/.test(val)) return;
    const [r, g, b] = hexToRgb(val);
    const [h, s, v] = rgbToHsv(r, g, b);
    selectedH = h; selectedS = s; selectedV = v;
    document.getElementById('briWheel').value = Math.round(v);
    document.getElementById('colorPreview').style.background = val;
    drawWheel(document.getElementById('colorWheel'), Math.round(v));
}

function closeColorModal() {
    document.getElementById('colorModal').classList.remove('open');
    colorModalTargetMode = -1;
}

function confirmColor() {
    if (colorModalTargetMode < 0) return;
    const bri = parseInt(document.getElementById('briWheel').value);
    const [r, g, b] = hsvToRgb(selectedH, selectedS, bri / 100);
    const hex = rgbToHex(r, g, b);

    config.modes[colorModalTargetMode].c = hex;
    document.getElementById('swatch_' + colorModalTargetMode).style.background = '#' + hex;
    sendModeConfig(colorModalTargetMode);
    closeColorModal();
}

document.getElementById('connBtn').addEventListener('click', connectSerial);
document.getElementById('testHapticBtn').addEventListener('click', () => sendCommand('TEST:HAPTIC'));

// Seed default mode list for UI before connection
config.modes = [
    {name:"SCROLL",     en:1, c:"0000ff", hp:0, inv:0, thr:10},
    {name:"VOLUME",     en:1, c:"00ff00", hp:3, inv:0, thr:25},
    {name:"TIMELINE",   en:1, c:"ff0080", hp:0, inv:0, thr:15},
    {name:"ZOOM",       en:0, c:"ff9500", hp:0, inv:0, thr:15},
    {name:"H_SCROLL",   en:0, c:"00c2a8", hp:2, inv:0, thr:10},
    {name:"BRIGHTNESS", en:0, c:"ffd700", hp:3, inv:0, thr:20},
    {name:"TABBING",    en:0, c:"9b59b6", hp:0, inv:0, thr:20},
    {name:"UNDO_REDO",  en:0, c:"e74c3c", hp:1, inv:0, thr:15},
];
renderModeList();
renderCPIButtons();
renderHapticProfiles(0);
