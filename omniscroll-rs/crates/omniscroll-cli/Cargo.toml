[package]
name = "omniscroll-cli"
version = "0.1.0"
edition = "2021"
authors = ["roufsweb"]
description = "OmniScroll CLI - Hardware diagnostics, flashing, and serial telemetry monitor"

[[bin]]
name = "omniscroll-cli"
path = "src/main.rs"

[dependencies]
omniscroll-core = { path = "../omniscroll-core" }
omniscroll-bridge = { path = "../omniscroll-bridge" }
clap = { version = "4.5", features = ["derive"] }
serialport = "4.7"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
