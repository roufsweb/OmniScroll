[package]
name = "omniscroll-bridge"
version = "0.1.0"
edition = "2021"
authors = ["roufsweb"]
description = "High-performance Win32 virtual input bridge and async transport for OmniScroll"

[dependencies]
omniscroll-core = { path = "../omniscroll-core" }
tokio = { version = "1.43", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
windows = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
serialport = "4.7"
tracing = "0.1"
serde_json = "1.0"
